name: CI/CD Pipeline for Foodgram Tests

on:
  push:
    branches: [ main, master, develop ]
  

jobs:
  test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create assets directory
        run: mkdir -p assets
      
      - name: Pull Chrome image
        run: docker pull selenoid/chrome:128.0
      
      - name: Start Selenoid with Docker Compose
        run: |
          docker compose up -d
          sleep 15
      
      - name: Check Selenoid status
        run: curl http://localhost:4444/status
      
      - name: Run tests with Allure
        run: |
          pytest tests/ --alluredir=allure-results -v
      
      - name: Install Allure
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure-2.29.0.tgz
          echo "$(pwd)/allure-2.29.0/bin" >> $GITHUB_PATH
      
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
      
      - name: Stop Selenoid
        if: always()
        run: docker compose down